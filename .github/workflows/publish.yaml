name: Publish

on:
    push:
        tags: ["v*"]

jobs:
    publish:
        runs-on: ubuntu-slim
        permissions:
            contents: write
            id-token: write
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Vite+
              uses: voidzero-dev/setup-vp@v1.20.0
              with:
                  cache: true

            - name: Install Dependencies
              run: vp install

            - name: Build Application
              run: vp run build

            - name: Publish to npm
              run: vp pm publish

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^")"
                  git log --reverse --no-merges --pretty="- %s" "$previous..$GITHUB_REF_NAME^" > notes.md
                  gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
